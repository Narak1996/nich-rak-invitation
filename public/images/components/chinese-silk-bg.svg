<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <defs>
    <!-- Deep Imperial Ruby Silk Satin Gradient -->
    <radialGradient id="imperialSilk" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#9E121E"/>
      <stop offset="50%" stop-color="#800B15"/>
      <stop offset="100%" stop-color="#5E050D"/>
    </radialGradient>

    <!-- Silk Weave Pattern Texture -->
    <pattern id="silkWeave" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M 0 3 L 3 0 L 6 3 L 3 6 Z" fill="none" stroke="#FFF" stroke-width="0.4" opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Base Radiant Silk Fabric -->
  <rect width="240" height="240" fill="url(#imperialSilk)"/>
  <rect width="240" height="240" fill="url(#silkWeave)"/>

  <!-- Classical Chinese Diamond Huiwen (回纹) Lattice Brocade (Antique Gold #FFD700) -->
  <g stroke="#FFD700" fill="none" opacity="0.32" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Diamond Frame -->
    <polygon points="120,12 228,120 120,228 12,120" stroke-width="1.5"/>
    <polygon points="120,24 216,120 120,216 24,120" stroke-width="0.8" stroke-dasharray="3 3"/>

    <!-- Huiwen / Key Fret Accents at Diamond Vertices -->
    <!-- Top Vertex -->
    <path d="M 120 12 L 120 22 L 126 22 L 126 16 L 114 16 L 114 26 L 120 26"/>
    <!-- Right Vertex -->
    <path d="M 228 120 L 218 120 L 218 126 L 224 126 L 224 114 L 214 114 L 214 120"/>
    <!-- Bottom Vertex -->
    <path d="M 120 228 L 120 218 L 114 218 L 114 224 L 126 224 L 126 214 L 120 214"/>
    <!-- Left Vertex -->
    <path d="M 12 120 L 22 120 L 22 114 L 16 114 L 16 126 L 26 126 L 26 120"/>

    <!-- Auspicious Ruyi Cloud Wings Flanking Center (如意祥云) -->
    <!-- Left Cloud Wing -->
    <path d="M 75 110 C 65 102, 60 115, 68 122 C 76 130, 92 128, 98 120 C 104 112, 98 100, 88 105 C 82 96, 70 98, 75 110 Z"/>
    <path d="M 70 122 C 60 120, 56 130, 65 136 C 73 140, 82 138, 86 132"/>

    <!-- Right Cloud Wing -->
    <path d="M 165 110 C 175 102, 180 115, 172 122 C 164 130, 148 128, 142 120 C 136 112, 142 100, 152 105 C 158 96, 170 98, 165 110 Z"/>
    <path d="M 170 122 C 180 120, 184 130, 175 136 C 167 140, 158 138, 154 132"/>

    <!-- Corner Cloud Motifs (Tiling smoothly across 4 corners) -->
    <!-- Top-Left Corner -->
    <path d="M 0 0 C 18 4, 30 16, 32 32 C 34 46, 20 54, 10 48 C 2 44, 4 34, 12 36 C 16 38, 18 32, 14 28 C 10 24, 0 20, 0 0 Z"/>
    <!-- Top-Right Corner -->
    <path d="M 240 0 C 222 4, 210 16, 208 32 C 206 46, 220 54, 230 48 C 238 44, 236 34, 228 36 C 224 38, 222 32, 226 28 C 230 24, 240 20, 240 0 Z"/>
    <!-- Bottom-Left Corner -->
    <path d="M 0 240 C 18 236, 30 224, 32 208 C 34 194, 20 186, 10 192 C 2 196, 4 206, 12 204 C 16 202, 18 208, 14 212 C 10 216, 0 220, 0 240 Z"/>
    <!-- Bottom-Right Corner -->
    <path d="M 240 240 C 222 236, 210 224, 208 208 C 206 194, 220 186, 230 192 C 238 196, 236 206, 228 204 C 224 202, 222 208, 226 212 C 230 216, 240 220, 240 240 Z"/>
  </g>

  <!-- Center Double Happiness (囍) Medallion Watermark Woven in Brocade -->
  <g fill="#FFD700" opacity="0.28">
    <!-- Classical Stylized 囍 Silhouette -->
    <!-- Left 喜 -->
    <rect x="108" y="104" width="9" height="1.8"/>
    <rect x="112" y="101" width="1.8" height="6"/>
    <rect x="107" y="108" width="11" height="1.5"/>
    <rect x="109" y="111" width="7" height="4" fill="none" stroke="#FFD700" stroke-width="1.2"/>
    <rect x="106" y="117" width="13" height="1.5"/>
    <rect x="108" y="120" width="9" height="1.5"/>
    <rect x="108" y="123" width="9" height="7" fill="none" stroke="#FFD700" stroke-width="1.2"/>
    <line x1="108" y1="126" x2="117" y2="126" stroke="#FFD700" stroke-width="1"/>

    <!-- Right 喜 -->
    <rect x="123" y="104" width="9" height="1.8"/>
    <rect x="127" y="101" width="1.8" height="6"/>
    <rect x="122" y="108" width="11" height="1.5"/>
    <rect x="124" y="111" width="7" height="4" fill="none" stroke="#FFD700" stroke-width="1.2"/>
    <rect x="121" y="117" width="13" height="1.5"/>
    <rect x="123" y="120" width="9" height="1.5"/>
    <rect x="123" y="123" width="9" height="7" fill="none" stroke="#FFD700" stroke-width="1.2"/>
    <line x1="123" y1="126" x2="132" y2="126" stroke="#FFD700" stroke-width="1"/>
  </g>

  <!-- Shimmering Gold Foil Flakes (金箔飞金) -->
  <g fill="#FFD700" opacity="0.45">
    <circle cx="120" cy="48" r="1.4"/>
    <circle cx="120" cy="192" r="1.4"/>
    <circle cx="48" cy="120" r="1.4"/>
    <circle cx="192" cy="120" r="1.4"/>
    <circle cx="68" cy="68" r="1.2"/>
    <circle cx="172" cy="68" r="1.2"/>
    <circle cx="68" cy="172" r="1.2"/>
    <circle cx="172" cy="172" r="1.2"/>
  </g>
</svg>
