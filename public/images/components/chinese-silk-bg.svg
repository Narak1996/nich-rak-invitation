<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <!-- Imperial Red Brocade Base -->
    <radialGradient id="silkGleam" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#8E0F19"/>
      <stop offset="70%" stop-color="#730A12"/>
      <stop offset="100%" stop-color="#5A050B"/>
    </radialGradient>
  </defs>

  <!-- Deep Imperial Silk Background -->
  <rect width="200" height="200" fill="url(#silkGleam)"/>

  <!-- Subtle Woven Silk Texture Lines -->
  <g opacity="0.04" stroke="#FFF" stroke-width="0.5">
    <line x1="0" y1="0" x2="200" y2="200"/>
    <line x1="50" y1="0" x2="200" y2="150"/>
    <line x1="0" y1="50" x2="150" y2="200"/>
    <line x1="100" y1="0" x2="200" y2="100"/>
    <line x1="0" y1="100" x2="100" y2="200"/>
    <line x1="150" y1="0" x2="200" y2="50"/>
    <line x1="0" y1="150" x2="50" y2="200"/>
  </g>

  <!-- Auspicious Clouds & Lattice Brocade (祥云织锦) in Fine Antique Gold -->
  <g stroke="#D4AF37" fill="none" opacity="0.16" stroke-width="1.2">
    <!-- Center Auspicious Cloud Motif -->
    <path d="M 85 95 C 75 90, 70 102, 80 110 C 90 118, 105 118, 115 110 C 125 102, 120 90, 110 95 C 105 85, 90 85, 85 95 Z" stroke-dasharray="100" stroke-dashoffset="0"/>
    <path d="M 82 108 C 72 105, 68 115, 78 122 C 86 128, 98 128, 106 122" />
    <circle cx="100" cy="100" r="1.5" fill="#D4AF37"/>

    <!-- Corner Clouds (Tiling to 4 corners) -->
    <!-- Top-Left -->
    <path d="M -15 -5 C -25 -10, -30 2, -20 10 C -10 18, 5 18, 15 10 C 25 2, 20 -10, 10 -5 C 5 -15, -10 -15, -15 -5 Z"/>
    <path d="M -18 8 C -28 5, -32 15, -22 22 C -14 28, -2 28, 6 22"/>
    
    <!-- Top-Right -->
    <path d="M 185 -5 C 175 -10, 170 2, 180 10 C 190 18, 205 18, 215 10 C 225 2, 220 -10, 210 -5 C 205 -15, 190 -15, 185 -5 Z"/>
    
    <!-- Bottom-Left -->
    <path d="M -15 195 C -25 190, -30 202, -20 210 C -10 218, 5 218, 15 210 C 25 202, 20 190, 10 195 C 5 185, -10 185, -15 195 Z"/>

    <!-- Bottom-Right -->
    <path d="M 185 195 C 175 190, 170 202, 180 210 C 190 218, 205 218, 215 210 C 225 202, 220 190, 210 195 C 205 185, 190 185, 185 195 Z"/>
    <path d="M 182 208 C 172 205, 168 215, 178 222"/>

    <!-- Traditional Chinese Diamond Geometric Lattice (菱形锦地) -->
    <path d="M 100 20 L 180 100 L 100 180 L 20 100 Z" stroke-width="0.8" opacity="0.6"/>
    <path d="M 100 30 L 170 100 L 100 170 L 30 100 Z" stroke-width="0.4" stroke-dasharray="4 4" opacity="0.5"/>

    <!-- Small Auspicious Floral Ruyi Florets -->
    <circle cx="100" cy="20" r="3" fill="#FFD700" opacity="0.2"/>
    <circle cx="180" cy="100" r="3" fill="#FFD700" opacity="0.2"/>
    <circle cx="100" cy="180" r="3" fill="#FFD700" opacity="0.2"/>
    <circle cx="20" cy="100" r="3" fill="#FFD700" opacity="0.2"/>
  </g>
</svg>
