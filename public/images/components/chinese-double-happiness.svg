<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <radialGradient id="goldMedallion" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFF2A3"/>
      <stop offset="60%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8F6B08"/>
    </radialGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#550A10" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Decorative Medallion Ring -->
  <circle cx="50" cy="50" r="46" stroke="url(#goldMedallion)" stroke-width="2.5" fill="#A81822" filter="url(#goldGlow)"/>
  <circle cx="50" cy="50" r="42" stroke="url(#goldMedallion)" stroke-width="1" stroke-dasharray="3 2" fill="none"/>
  
  <!-- Double Happiness Character (囍) -->
  <text x="50" y="66" font-family="'Songti SC', 'SimSun', 'Noto Serif SC', 'Cinzel', serif" font-size="46" font-weight="900" fill="url(#goldMedallion)" text-anchor="middle" letter-spacing="1">囍</text>
</svg>
