<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="emeraldGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF3CD" />
      <stop offset="40%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#9E7D2D" />
      <stop offset="100%" stop-color="#F2DF95" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer Floral Ring -->
  <circle cx="60" cy="60" r="52" stroke="url(#emeraldGold)" stroke-width="1.8" stroke-dasharray="3 3" opacity="0.8"/>
  <circle cx="60" cy="60" r="48" stroke="url(#emeraldGold)" stroke-width="1.2"/>
  
  <!-- Laurel / Olive Botanical Leaves -->
  <!-- Left Branch -->
  <path d="M 60 12 C 45 15, 25 35, 22 60 C 20 75, 30 95, 60 108" stroke="url(#emeraldGold)" stroke-width="1.5" fill="none"/>
  <path d="M 38 28 C 30 25, 27 32, 34 36 C 40 40, 42 34, 38 28 Z" fill="url(#emeraldGold)" opacity="0.9"/>
  <path d="M 28 42 C 20 40, 18 47, 24 51 C 30 55, 32 48, 28 42 Z" fill="url(#emeraldGold)" opacity="0.9"/>
  <path d="M 23 58 C 15 57, 14 65, 20 68 C 26 71, 28 64, 23 58 Z" fill="url(#emeraldGold)" opacity="0.9"/>
  <path d="M 25 74 C 18 75, 18 83, 24 85 C 31 87, 31 79, 25 74 Z" fill="url(#emeraldGold)" opacity="0.9"/>
  <path d="M 35 88 C 29 91, 31 99, 37 99 C 43 100, 42 92, 35 88 Z" fill="url(#emeraldGold)" opacity="0.9"/>

  <!-- Right Branch -->
  <path d="M 60 12 C 75 15, 95 35, 98 60 C 100 75, 90 95, 60 108" stroke="url(#emeraldGold)" stroke-width="1.5" fill="none"/>
  <path d="M 82 28 C 90 25, 93 32, 86 36 C 80 40, 78 34, 82 28 Z" fill="url(#emeraldGold)" opacity="0.9"/>
  <path d="M 92 42 C 100 40, 102 47, 96 51 C 90 55, 88 48, 92 42 Z" fill="url(#emeraldGold)" opacity="0.9"/>
  <path d="M 97 58 C 105 57, 106 65, 100 68 C 94 71, 92 64, 97 58 Z" fill="url(#emeraldGold)" opacity="0.9"/>
  <path d="M 95 74 C 102 75, 102 83, 96 85 C 89 87, 89 79, 95 74 Z" fill="url(#emeraldGold)" opacity="0.9"/>
  <path d="M 85 88 C 91 91, 89 99, 83 99 C 77 100, 78 92, 85 88 Z" fill="url(#emeraldGold)" opacity="0.9"/>

  <!-- Center Botanical Monogram Diamond -->
  <polygon points="60,32 80,60 60,88 40,60" stroke="url(#emeraldGold)" stroke-width="1.2" fill="none"/>
  
  <!-- Center Couple Monogram N&S -->
  <text x="60" y="65" font-family="'Cinzel Decorative', 'Cinzel', 'Playfair Display', serif" font-size="16" font-weight="bold" fill="url(#emeraldGold)" text-anchor="middle" filter="url(#goldGlow)" letter-spacing="1">N&amp;S</text>
  <circle cx="60" cy="24" r="2" fill="url(#emeraldGold)"/>
  <circle cx="60" cy="96" r="2" fill="url(#emeraldGold)"/>
</svg>
