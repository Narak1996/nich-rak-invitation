<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 50" width="100%" height="100%">
  <defs>
    <linearGradient id="divGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0"/>
      <stop offset="25%" stop-color="#E5BE53" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#FFF0A3" stop-opacity="1"/>
      <stop offset="75%" stop-color="#E5BE53" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="vineGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE07A"/>
      <stop offset="50%" stop-color="#C29424"/>
      <stop offset="100%" stop-color="#8C630D"/>
    </linearGradient>
  </defs>

  <!-- Left Vine & Leaf Ornaments -->
  <path d="M 60 25 C 110 25, 140 18, 180 22 C 200 24, 215 25, 230 25" fill="none" stroke="url(#vineGold)" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 120 25 C 130 15, 145 15, 150 22 C 145 23, 135 24, 120 25 Z" fill="url(#vineGold)" opacity="0.85"/>
  <path d="M 175 22 C 185 12, 200 13, 203 21 C 196 22, 188 23, 175 22 Z" fill="url(#vineGold)" opacity="0.85"/>
  <circle cx="218" cy="25" r="2" fill="#FFE885"/>
  <circle cx="90" cy="25" r="1.5" fill="#C29424"/>

  <!-- Right Vine & Leaf Ornaments (Mirrored) -->
  <g transform="translate(500, 0) scale(-1, 1)">
    <path d="M 60 25 C 110 25, 140 18, 180 22 C 200 24, 215 25, 230 25" fill="none" stroke="url(#vineGold)" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 120 25 C 130 15, 145 15, 150 22 C 145 23, 135 24, 120 25 Z" fill="url(#vineGold)" opacity="0.85"/>
    <path d="M 175 22 C 185 12, 200 13, 203 21 C 196 22, 188 23, 175 22 Z" fill="url(#vineGold)" opacity="0.85"/>
    <circle cx="218" cy="25" r="2" fill="#FFE885"/>
    <circle cx="90" cy="25" r="1.5" fill="#C29424"/>
  </g>

  <!-- Center Romduol Flower (scaled at 250, 25) -->
  <g transform="translate(235, 10) scale(0.25)">
    <!-- 3 Outer Petals -->
    <path d="M60 12 C44 26, 38 48, 56 60 C64 60, 58 48, 60 12 Z" fill="url(#vineGold)"/>
    <path d="M60 12 C76 26, 82 48, 64 60 C56 60, 62 48, 60 12 Z" fill="url(#vineGold)"/>
    <g transform="rotate(120 60 60)">
      <path d="M60 12 C44 26, 38 48, 56 60 C64 60, 58 48, 60 12 Z" fill="url(#vineGold)"/>
      <path d="M60 12 C76 26, 82 48, 64 60 C56 60, 62 48, 60 12 Z" fill="url(#vineGold)"/>
    </g>
    <g transform="rotate(240 60 60)">
      <path d="M60 12 C44 26, 38 48, 56 60 C64 60, 58 48, 60 12 Z" fill="url(#vineGold)"/>
      <path d="M60 12 C76 26, 82 48, 64 60 C56 60, 62 48, 60 12 Z" fill="url(#vineGold)"/>
    </g>
    <!-- 3 Inner Petals -->
    <g transform="rotate(60 60 60)">
      <path d="M60 32 C50 42, 52 54, 60 60 C68 54, 70 42, 60 32 Z" fill="#FFE885"/>
    </g>
    <g transform="rotate(180 60 60)">
      <path d="M60 32 C50 42, 52 54, 60 60 C68 54, 70 42, 60 32 Z" fill="#FFE885"/>
    </g>
    <g transform="rotate(300 60 60)">
      <path d="M60 32 C50 42, 52 54, 60 60 C68 54, 70 42, 60 32 Z" fill="#FFE885"/>
    </g>
    <!-- Center Core -->
    <circle cx="60" cy="60" r="7" fill="#C29424"/>
    <circle cx="60" cy="60" r="4" fill="#FFF2BF"/>
  </g>
</svg>
