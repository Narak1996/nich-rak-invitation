<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Outer Petal Gold Gradient -->
    <linearGradient id="romduolOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2BF"/>
      <stop offset="40%" stop-color="#E5BE53"/>
      <stop offset="85%" stop-color="#C29424"/>
      <stop offset="100%" stop-color="#8C630D"/>
    </linearGradient>

    <!-- Inner Petal Gold Gradient -->
    <linearGradient id="romduolInner" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9E7010"/>
      <stop offset="35%" stop-color="#DFB342"/>
      <stop offset="70%" stop-color="#FFEB99"/>
      <stop offset="100%" stop-color="#FFE07A"/>
    </linearGradient>

    <!-- Center Core Glow -->
    <radialGradient id="romduolCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFAD9"/>
      <stop offset="50%" stop-color="#E5BE53"/>
      <stop offset="85%" stop-color="#A67817"/>
      <stop offset="100%" stop-color="#5E3F05"/>
    </radialGradient>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#543702" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#goldGlow)">
    <!-- 3 BROAD OUTER PETALS (ត្របកក្រៅទាំង៣) -->
    <!-- Top Petal (pointing upward) -->
    <path d="M60 12 C44 26, 38 48, 56 60 C64 60, 58 48, 60 12 Z" fill="url(#romduolOuter)" stroke="#A67817" stroke-width="0.8"/>
    <path d="M60 12 C76 26, 82 48, 64 60 C56 60, 62 48, 60 12 Z" fill="url(#romduolOuter)" stroke="#A67817" stroke-width="0.8"/>
    <!-- Top Petal Central Ridge -->
    <path d="M60 16 Q60 38 60 58" stroke="#FFE994" stroke-width="1.2" fill="none" opacity="0.8"/>

    <!-- Bottom Left Petal (pointing 210 degrees) -->
    <g transform="rotate(120 60 60)">
      <path d="M60 12 C44 26, 38 48, 56 60 C64 60, 58 48, 60 12 Z" fill="url(#romduolOuter)" stroke="#A67817" stroke-width="0.8"/>
      <path d="M60 12 C76 26, 82 48, 64 60 C56 60, 62 48, 60 12 Z" fill="url(#romduolOuter)" stroke="#A67817" stroke-width="0.8"/>
      <path d="M60 16 Q60 38 60 58" stroke="#FFE994" stroke-width="1.2" fill="none" opacity="0.8"/>
    </g>

    <!-- Bottom Right Petal (pointing 330 degrees) -->
    <g transform="rotate(240 60 60)">
      <path d="M60 12 C44 26, 38 48, 56 60 C64 60, 58 48, 60 12 Z" fill="url(#romduolOuter)" stroke="#A67817" stroke-width="0.8"/>
      <path d="M60 12 C76 26, 82 48, 64 60 C56 60, 62 48, 60 12 Z" fill="url(#romduolOuter)" stroke="#A67817" stroke-width="0.8"/>
      <path d="M60 16 Q60 38 60 58" stroke="#FFE994" stroke-width="1.2" fill="none" opacity="0.8"/>
    </g>

    <!-- 3 INNER COMPACT PETALS (ត្របកក្នុងទាំង៣ - Interlocking Dome) -->
    <!-- Inner Petal 1 (rotated 60 deg) -->
    <g transform="rotate(60 60 60)">
      <path d="M60 32 C50 42, 52 54, 60 60 C68 54, 70 42, 60 32 Z" fill="url(#romduolInner)" stroke="#8C630D" stroke-width="0.8"/>
      <path d="M60 34 Q60 48 60 58" stroke="#FFF2BF" stroke-width="0.8" fill="none" opacity="0.9"/>
    </g>

    <!-- Inner Petal 2 (rotated 180 deg) -->
    <g transform="rotate(180 60 60)">
      <path d="M60 32 C50 42, 52 54, 60 60 C68 54, 70 42, 60 32 Z" fill="url(#romduolInner)" stroke="#8C630D" stroke-width="0.8"/>
      <path d="M60 34 Q60 48 60 58" stroke="#FFF2BF" stroke-width="0.8" fill="none" opacity="0.9"/>
    </g>

    <!-- Inner Petal 3 (rotated 300 deg) -->
    <g transform="rotate(300 60 60)">
      <path d="M60 32 C50 42, 52 54, 60 60 C68 54, 70 42, 60 32 Z" fill="url(#romduolInner)" stroke="#8C630D" stroke-width="0.8"/>
      <path d="M60 34 Q60 48 60 58" stroke="#FFF2BF" stroke-width="0.8" fill="none" opacity="0.9"/>
    </g>

    <!-- CENTER PISTIL / STAMEN CORE (កេសរផ្ការំដួល) -->
    <circle cx="60" cy="60" r="8" fill="url(#romduolCore)" stroke="#D4AF37" stroke-width="0.75"/>
    <circle cx="60" cy="60" r="4.5" fill="#FFE885" opacity="0.9"/>
    <!-- Stamen grains -->
    <circle cx="58" cy="58" r="1.1" fill="#754E05"/>
    <circle cx="62" cy="58" r="1.1" fill="#754E05"/>
    <circle cx="60" cy="62" r="1.1" fill="#754E05"/>
    <circle cx="58" cy="61" r="0.9" fill="#8C5F09"/>
    <circle cx="62" cy="61" r="0.9" fill="#8C5F09"/>
  </g>
</svg>
