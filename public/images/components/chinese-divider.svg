<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 50" fill="none">
  <defs>
    <linearGradient id="goldBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0"/>
      <stop offset="25%" stop-color="#FFD700" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#FFF2A3" stop-opacity="1"/>
      <stop offset="75%" stop-color="#FFD700" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="goldSeal" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFF5B8"/>
      <stop offset="50%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#AA7A1E"/>
    </radialGradient>
    <filter id="glow">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#3B050B" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Left Whispering Gold Line -->
  <line x1="30" y1="25" x2="160" y2="25" stroke="url(#goldBarGrad)" stroke-width="1.5"/>
  <circle cx="150" cy="25" r="2.5" fill="#FFD700"/>

  <!-- Left Auspicious Cloud (祥云) -->
  <g transform="translate(145, 12) scale(0.65)" filter="url(#glow)">
    <path d="M 15 20 C 5 15, 0 27, 10 35 C 20 43, 35 43, 45 35 C 55 27, 50 15, 40 20 C 35 10, 20 10, 15 20 Z" fill="#C72535" stroke="url(#goldSeal)" stroke-width="1.5"/>
    <path d="M 12 33 C 2 30, -2 40, 8 47 C 16 53, 28 53, 36 47" fill="none" stroke="url(#goldSeal)" stroke-width="1.2"/>
  </g>

  <!-- Center Double Happiness Medallion (囍) -->
  <g transform="translate(182, 7)" filter="url(#glow)">
    <rect x="0" y="0" width="36" height="36" rx="8" fill="#A81822" stroke="url(#goldSeal)" stroke-width="2"/>
    <rect x="3" y="3" width="30" height="30" rx="5" fill="none" stroke="url(#goldSeal)" stroke-width="0.8" stroke-dasharray="2 1.5"/>
    <text x="18" y="26" font-family="'Songti SC', 'SimSun', 'Noto Serif SC', serif" font-size="22" font-weight="bold" fill="url(#goldSeal)" text-anchor="middle">囍</text>
  </g>

  <!-- Right Auspicious Cloud (祥云) - Mirrored -->
  <g transform="translate(255, 12) scale(-0.65, 0.65)" filter="url(#glow)">
    <path d="M 15 20 C 5 15, 0 27, 10 35 C 20 43, 35 43, 45 35 C 55 27, 50 15, 40 20 C 35 10, 20 10, 15 20 Z" fill="#C72535" stroke="url(#goldSeal)" stroke-width="1.5"/>
    <path d="M 12 33 C 2 30, -2 40, 8 47 C 16 53, 28 53, 36 47" fill="none" stroke="url(#goldSeal)" stroke-width="1.2"/>
  </g>

  <!-- Right Whispering Gold Line -->
  <circle cx="250" cy="25" r="2.5" fill="#FFD700"/>
  <line x1="240" y1="25" x2="370" y2="25" stroke="url(#goldBarGrad)" stroke-width="1.5"/>
</svg>
