<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" fill="none">
  <defs>
    <linearGradient id="palaceGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3D4" />
      <stop offset="35%" stop-color="#E5C384" />
      <stop offset="65%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#9B621D" />
    </linearGradient>
    <linearGradient id="palaceRuby" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B22B42" />
      <stop offset="100%" stop-color="#7A1B2A" />
    </linearGradient>
  </defs>
  <!-- Royal Palace Arch Crest Peak -->
  <path d="M 80 8 Q 83 22 92 28 Q 85 30 80 42 Q 75 30 68 28 Q 77 22 80 8 Z" fill="url(#palaceGold)"/>
  
  <!-- Outer Archway -->
  <path d="M 20 110 L 20 55 C 20 25, 45 15, 80 15 C 115 15, 140 25, 140 55 L 140 110" stroke="url(#palaceGold)" stroke-width="2.5" fill="none"/>
  
  <!-- Inner Archway with Khmer Lotus Petals -->
  <path d="M 30 110 L 30 60 C 30 35, 50 25, 80 25 C 110 25, 130 35, 130 60 L 130 110" stroke="url(#palaceGold)" stroke-width="1.2" stroke-dasharray="4 2" fill="none"/>

  <!-- Ornate Khmer Kbach Spire Pillars -->
  <!-- Left Spire -->
  <rect x="16" y="50" width="8" height="60" fill="url(#palaceGold)" rx="2"/>
  <circle cx="20" cy="46" r="4" fill="url(#palaceGold)"/>
  <circle cx="20" cy="38" r="2.5" fill="url(#palaceGold)"/>

  <!-- Right Spire -->
  <rect x="136" y="50" width="8" height="60" fill="url(#palaceGold)" rx="2"/>
  <circle cx="140" cy="46" r="4" fill="url(#palaceGold)"/>
  <circle cx="140" cy="38" r="2.5" fill="url(#palaceGold)"/>

  <!-- Center Royal Medallion -->
  <circle cx="80" cy="62" r="24" fill="#FAF5EE" stroke="url(#palaceGold)" stroke-width="2"/>
  <circle cx="80" cy="62" r="20" stroke="url(#palaceGold)" stroke-width="0.8" stroke-dasharray="2 2"/>
  
  <!-- Khmer Royal Emblem inside Medallion -->
  <text x="80" y="67" font-family="'Cinzel Decorative', 'Cinzel', serif" font-size="12" font-weight="bold" fill="url(#palaceGold)" text-anchor="middle" letter-spacing="1">N&amp;S</text>
  
  <!-- Hanging Lotus Drop -->
  <path d="M 80 86 Q 84 94 80 102 Q 76 94 80 86 Z" fill="url(#palaceGold)"/>
</svg>
