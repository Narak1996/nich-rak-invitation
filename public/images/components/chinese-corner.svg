<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="cnGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0"/>
      <stop offset="35%" stop-color="#FFD700"/>
      <stop offset="70%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <linearGradient id="cnRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C72535"/>
      <stop offset="100%" stop-color="#7D0A12"/>
    </linearGradient>
    <filter id="goldShine" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#3A0005" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Traditional Chinese Auspicious Corner Fretwork & Ruyi Motif (回纹如意角) -->
  <g filter="url(#goldShine)">
    <!-- Outer Traditional Corner Lines -->
    <path d="M 6 50 L 6 8 C 6 6.9 6.9 6 8 6 L 50 6" stroke="url(#cnGoldGrad)" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Outer Corner Meander / Huiwen (回纹) -->
    <path d="M 12 42 L 12 14 C 12 12.9 12.9 12 14 12 L 42 12 L 42 22 L 22 22 L 22 42 Z" fill="none" stroke="url(#cnGoldGrad)" stroke-width="2" stroke-linejoin="round"/>
    
    <!-- Auspicious Ruyi Cloud Curve (如意云纹) -->
    <path d="M 14 14 C 18 18, 24 16, 26 20 C 28 24, 24 28, 20 28 C 16 28, 14 22, 14 14 Z" fill="url(#cnGoldGrad)" opacity="0.9"/>
    
    <!-- Small Decorative Corner Blossom / Knot Accent -->
    <circle cx="10" cy="10" r="3.5" fill="url(#cnGoldGrad)"/>
    <circle cx="10" cy="10" r="1.5" fill="#7D0A12"/>

    <!-- Subtle Floral Ruyi Petal Flurry -->
    <path d="M 32 8 C 36 12, 40 10, 44 12 C 40 15, 34 14, 32 8 Z" fill="url(#cnGoldGrad)" opacity="0.85"/>
    <path d="M 8 32 C 12 36, 10 40, 12 44 C 15 40, 14 34, 8 32 Z" fill="url(#cnGoldGrad)" opacity="0.85"/>

    <!-- Auspicious Dot Accents -->
    <circle cx="56" cy="6" r="2" fill="url(#cnGoldGrad)"/>
    <circle cx="6" cy="56" r="2" fill="url(#cnGoldGrad)"/>
  </g>
</svg>
