<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | E-Invitation System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="wedding-bg-pattern min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-white rounded-3xl p-8 border border-[#E5D5BC] shadow-xl text-center relative">
    <div class="khmer-corner-tl"></div>
    <div class="khmer-corner-tr"></div>
    <div class="khmer-corner-bl"></div>
    <div class="khmer-corner-br"></div>

    <div class="w-16 h-16 rounded-full bg-[#FAF7F2] border border-[#C5A059] flex items-center justify-center mx-auto mb-4 shadow-sm">
      <svg class="w-8 h-8 text-[#4E3227]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
    </div>

    <h2 class="font-khmer-title text-xl text-[#4E3227] mb-1">ផ្ទាំងគ្រប់គ្រងរៀបចំពិធី</h2>
    <p class="text-xs text-[#7A6F68] font-khmer-body mb-6">Wedding Management Admin Portal</p>

    <div id="login-error" class="hidden mb-4 p-3 rounded-xl bg-red-50 text-red-700 text-xs font-medium border border-red-200"></div>

    <form id="login-form" class="space-y-4 text-left">
      <div>
        <label class="block text-xs font-bold text-[#4E3227] mb-1">Username / គណនី</label>
        <input type="text" id="username" required placeholder="គណនី / Username" class="w-full px-4 py-2.5 text-sm rounded-xl border border-[#E5D5BC] bg-[#FAF7F2] focus:bg-white focus:outline-none focus:border-[#C5A059]">
      </div>
      <div>
        <label class="block text-xs font-bold text-[#4E3227] mb-1">Password / ពាក្យសម្ងាត់</label>
        <input type="password" id="password" required placeholder="ពាក្យសម្ងាត់ / Password" class="w-full px-4 py-2.5 text-sm rounded-xl border border-[#E5D5BC] bg-[#FAF7F2] focus:bg-white focus:outline-none focus:border-[#C5A059]">
      </div>

      <button type="submit" class="w-full py-3 bg-[#4E3227] hover:bg-[#6E4939] text-white rounded-xl text-sm font-bold shadow-md transition mt-2">
        ចូលគ្រប់គ្រង (Sign In)
      </button>
    </form>

    <div class="mt-6 pt-4 border-t border-[#E5D5BC]/60">
      <a href="/" class="text-xs text-[#C5A059] hover:underline inline-flex items-center gap-1">
        ← ត្រឡប់ទៅទំព័រសំបុត្រ (View Invitation)
      </a>
    </div>
  </div>

  <script>
    // If already authenticated, redirect to /admin
    (async () => {
      try {
        const savedToken = localStorage.getItem('admin_token');
        const headers = savedToken ? { 'Authorization': 'Bearer ' + savedToken } : {};
        const chk = await fetch('/api/auth/check', { headers });
        const data = await chk.json();
        if (data.authenticated) {
          window.location.href = '/admin';
        }
      } catch (e) {}
    })();

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value.trim();
      const errBox = document.getElementById('login-error');
      const submitBtn = e.target.querySelector('button[type="submit"]');
      const origText = submitBtn.innerHTML;

      errBox.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.innerHTML = `<span>កំពុងផ្ទៀងផ្ទាត់... (Signing in...)</span>`;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: u, password: p })
        });
        const data = await res.json();
        if (res.ok && data.success) {
          if (data.token) {
            localStorage.setItem('admin_token', data.token);
            document.cookie = `admin_token=${data.token}; path=/; max-age=604800; SameSite=Lax`;
            window.location.href = `/admin?token=${encodeURIComponent(data.token)}`;
          } else {
            window.location.href = '/admin';
          }
        } else {
          submitBtn.disabled = false;
          submitBtn.innerHTML = origText;
          errBox.textContent = data.error || 'ឈ្មោះគណនី ឬពាក្យសម្ងាត់មិនត្រឹមត្រូវឡើយ';
          errBox.classList.remove('hidden');
        }
      } catch (err) {
        submitBtn.disabled = false;
        submitBtn.innerHTML = origText;
        errBox.textContent = 'បញ្ហាបណ្តាញក្នុងការតភ្ជាប់ (Network connection error)';
        errBox.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
